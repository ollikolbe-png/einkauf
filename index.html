<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufshelfer</title>
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#15241c; --muted:#5b6a61; --line:#dde4db;
  --accent:#0f6b4f; --accent-ink:#ffffff; --tag:#ffd83d; --tag-ink:#1c1a0c; --sale:#c3271d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1612; --surface:#18221c; --ink:#e7efe9; --muted:#98a99f; --line:#2a372f;
    --accent:#4fc79a; --accent-ink:#06261b; --tag:#f2c935; --tag-ink:#1c1a0c; --sale:#ff7d6e;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header.top{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top img{width:30px;height:30px;border-radius:8px}
header.top h1{font:800 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
main{flex:1;overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;position:relative}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sale);color:#fff;font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}

.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.ghost{border-color:transparent}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.hint{font-size:13px;color:var(--muted);margin:0}

form.add{display:flex;gap:8px}
form.add .field{flex:1}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--sale)}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:18px;height:18px;opacity:0}
.row.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.done .check svg{opacity:1}
.row.done .name{text-decoration:line-through;color:var(--muted);font-weight:500}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.foot .btns{display:flex;gap:8px}
.foot .btn{padding:8px 12px;font-size:14px}

.total{background:var(--tag);color:var(--tag-ink);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.total .lbl{font-size:13px;font-weight:600}
.total .sum{font:800 38px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qty{flex:none;display:flex;align-items:center;gap:2px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:18px;line-height:1;padding:0}
.qty span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.line{flex:none;min-width:62px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.store{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:60px}
.store:first-child{border-top:0}
.store .logo{flex:none;width:40px;height:40px;border-radius:10px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font:800 17px/1 var(--display)}
.store .arrow{flex:none;color:var(--muted)}
.store .arrow svg{width:20px;height:20px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h2{font:800 20px/1.2 var(--display);margin:0}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .status{font-size:14px;margin:0;min-height:20px}
.sheet .btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}

#scanner{position:fixed;inset:0;background:#000;z-index:15;display:flex;flex-direction:column}
#scanner[hidden]{display:none}
#scanner video{flex:1;width:100%;height:100%;object-fit:cover;min-height:0}
#scanner .frame{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid var(--tag);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
#scanner .msg{color:#fff;text-align:center;font-size:15px;margin:0}
#scanner .bar .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="icon-180.png" alt="">
    <h1>Einkaufshelfer</h1>
  </header>

  <main id="main">
    <section class="view" id="v-liste">
      <form class="add" id="list-form">
        <input class="field" id="list-input" type="text" placeholder="Was brauchst du?" autocomplete="off" enterkeyhint="done">
        <button class="btn primary" type="submit">Hinzufügen</button>
      </form>
      <div id="list-rows"></div>
      <div class="foot" id="list-foot"></div>
    </section>

    <section class="view" id="v-warenkorb" hidden>
      <div class="total">
        <div><div class="lbl">Gesamtsumme</div><div class="lbl" id="cart-count" style="font-weight:500"></div></div>
        <div class="sum" id="cart-sum">0,00 €</div>
      </div>
      <div class="actions">
        <button class="btn primary" id="scan-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5h3M20 8V5h-3M4 16v3h3M20 16v3h-3M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>
          Scannen
        </button>
        <button class="btn" id="manual-btn" type="button">Von Hand</button>
      </div>
      <p class="hint">Halte den Barcode in den Rahmen. Bekannte Produkte erkennt die App mit Preis wieder, bei neuen trägst du den Preis einmal ein.</p>
      <div id="cart-rows"></div>
      <div class="foot" id="cart-foot"></div>
    </section>

    <section class="view" id="v-prospekte" hidden>
      <p class="hint">Die aktuellen Angebote deiner Märkte rund um Mücke. Tippen öffnet den Prospekt.</p>
      <div class="rows" id="store-list"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Bereiche">
    <a href="#liste" data-tab="liste">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      Liste <span class="badge" id="b-liste"></span>
    </a>
    <a href="#warenkorb" data-tab="warenkorb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      Warenkorb <span class="badge" id="b-korb"></span>
    </a>
    <a href="#prospekte" data-tab="prospekte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>
      Prospekte
    </a>
  </nav>
</div>

<div id="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="bar">
    <p class="msg" id="scan-msg">Kamera startet …</p>
    <div class="btns">
      <button class="btn" type="button" id="scan-close">Abbrechen</button>
      <button class="btn" type="button" id="scan-manual">Nummer eintippen</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">Produkt</h2>
    <p class="status" id="sheet-status" aria-live="polite"></p>
    <label for="p-name">Produkt
      <input class="field" id="p-name" type="text" autocomplete="off" required>
    </label>
    <div class="two">
      <label for="p-price">Preis in €
        <input class="field" id="p-price" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
      </label>
      <label for="p-qty">Anzahl
        <input class="field" id="p-qty" type="number" inputmode="numeric" min="1" max="99" value="1" required>
      </label>
    </div>
    <label for="p-ean" id="p-ean-wrap">Barcode (optional)
      <input class="field" id="p-ean" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </label>
    <div class="btns">
      <button class="btn" type="button" id="sheet-cancel">Abbrechen</button>
      <button class="btn primary" type="submit">In den Warenkorb</button>
    </div>
  </form>
</div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" crossorigin="anonymous" defer></script>
<script src="app.js" defer></script>
</body>
</html>
